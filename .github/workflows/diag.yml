name: Диагностика запуска на Mac

on:
  push:
    branches: [diag]
  workflow_dispatch:

jobs:
  mac-diag:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Скачать Electron
        run: |
          node node_modules/electron/install.js || true
          node -e 'console.log("EXE=" + require("electron"))' | tee -a "$GITHUB_ENV"
          ls -la "$(node -e 'process.stdout.write(require("electron"))')"

      - name: Помощник запуска
        run: |
          cat > run.sh <<'EOF'
          #!/bin/bash
          # run.sh <label> <executable> [args...]: start, wait, report
          label=$1; shift
          "$@" > "log-$label.txt" 2>&1 &
          pid=$!
          sleep 20
          if kill -0 $pid 2>/dev/null; then echo "RESULT $label: running"; kill $pid; else wait $pid; echo "RESULT $label: exited code=$?"; tail -20 "log-$label.txt"; fi
          EOF
          chmod +x run.sh

      - name: 8. Латинское имя + русское отображаемое имя, универсальная сборка
        run: |
          npx electron-builder --mac dir --universal --publish never -c.productName="Otryad Constructor" -c.mac.extendInfo.CFBundleDisplayName="Отрядный конструктор" || true
          APP=$(find dist -maxdepth 2 -name "*.app" | head -1); echo "$APP"; ls "$APP/Contents/MacOS/"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Contents/Info.plist"
          codesign --verify --deep --strict "$APP" && echo "signature ok"
          EXE="$APP/Contents/MacOS/$(ls "$APP/Contents/MacOS/" | head -1)"
          ./run.sh final "$EXE" || true
      - name: Отчёты о сбоях
        if: always()
        run: |
          ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -2 | while IFS= read -r f; do
            echo "=== $f"
            python3 - "$f" <<'EOF'
          import json, sys
          raw = open(sys.argv[1]).read()
          head, body = raw.split("\n", 1)
          d = json.loads(body)
          print("proc:", d.get("procName"), "| exception:", d.get("exception"), "| termination:", d.get("termination", {}).get("indicator"))
          for k in ("asi", "lastExceptionBacktrace"):
              if k in d: print(k, json.dumps(d[k])[:800])
          t = [x for x in d.get("threads", []) if x.get("triggered")]
          imgs = d.get("usedImages", [])
          if t:
              for fr in t[0].get("frames", [])[:12]:
                  img = imgs[fr["imageIndex"]]["name"] if fr.get("imageIndex") is not None and fr["imageIndex"] < len(imgs) else "?"
                  print("  ", img, fr.get("symbol", ""), fr.get("imageOffset"))
          EOF
          done
