name: Сборка exe и Mac

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установить зависимости
        run: npm install --no-audit --no-fund

      - name: Собрать установщик и portable exe
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Сохранить exe как артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: otryad-constructor-windows
          path: dist/*.exe

      - name: Выложить в релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установить зависимости
        run: npm install --no-audit --no-fund

      - name: Собрать dmg (Intel и Apple Silicon)
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Проверить подпись приложения
        run: |
          APP=$(find dist -maxdepth 2 -name "*.app" | head -1)
          echo "$APP"
          codesign -dv "$APP" 2>&1 | head -5
          codesign --verify --deep --strict "$APP"
          echo "signature ok"
          lipo -archs "$APP/Contents/MacOS/"*

      - name: Проверить, что приложение запускается
        run: |
          sw_vers
          APP=$(find dist -maxdepth 2 -name "*.app" | head -1)
          "$APP/Contents/MacOS/Отрядный конструктор" > smoke.log 2>&1 &
          PID=$!
          sleep 25
          if kill -0 $PID 2>/dev/null; then
            echo "app is running"
            kill $PID
          else
            echo "app exited early"
            cat smoke.log
            ls -t ~/Library/Logs/DiagnosticReports 2>/dev/null | head -3
            exit 1
          fi

      - name: Сохранить dmg как артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: otryad-constructor-mac
          path: |
            dist/*.dmg
            dist/*.zip

      - name: Выложить в релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
